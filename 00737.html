<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TENJIN NISHIDORI_FLOORMAP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f7f7f7;
      overflow-x: hidden; /* 横方向のはみ出しが原因のズレを潰す */
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0; /* 端末側の差を避ける */
    }

    .container img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px; /* 念のため中央寄せを強制 */
    }

    .link-text {
      display: inline-block;
      margin: 10px 0 20px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      color: #111827;
    }

    .link-text:visited {
      color: #111827;
    }

    .link-text:hover {
      text-decoration: underline;
    }
   <style>
    html, body {
      margin: 0;

      background-color: #f7f7f7;
      font-family: sans-serif;
    }
    .container {
      max-width: 1080px;
      width: 100%;

    .link-text:hover {
      background-color: #e08e0b;
      color: #000;
    }
    @media (max-width: 480px) {
      .link-text {

        padding: 6px 10px;
      }

  </style>
</head>
