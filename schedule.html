<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>【AI商品ナビ導入予定カレンダー】</title>
  <style>
    :root{
      --border:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --bg:#ffffff;
      --cellh:96px;
      --barh:20px;
      --gap:5px;
      --radius:10px;
      --font: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      --topH: 0px;
    }

    html, body{
      height:100%;
    }
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:#f9fafb;
      overflow:hidden;
      font-size:13px;
      line-height:1.35;
    }

    .topFixed{
      position:sticky;
      top:0;
      z-index:50;
      background:#f9fafb;
      border-bottom:1px solid var(--border);
    }
    header{
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    .title{
      max-width:1100px;
      margin:0 auto;
      padding:10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    h1{
      margin:0;
      font-size:16px;
      font-weight:900;
      letter-spacing:.01em;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:10px 12px;
      box-sizing:border-box;
    }

    .roadmap{
      background:#e0f2fe;
      border:1px solid var(--border);
      border-radius:14px;
      padding:8px 10px;
      margin:0 0 8px;
    }
    .roadmapHead{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .roadmapTitle{
      margin:0;
      font-size:12px;
      font-weight:800;
      color:var(--text);
    }
    .roadmapList{
      margin:8px 0 0;
      padding:0;
      list-style:none;
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
    }
    .roadmapItem{
      display:flex;
      align-items:flex-start;
      gap:10px;
      border:1px solid var(--border);
      border-radius:12px;
      padding:9px 9px;
      background:#fff;
      min-width:0;
    }
    .roadmapItem.done{
      background:#d1d5db;
    }
    .roadmapWhen{
      min-width:92px;
      font-size:11px;
      font-weight:800;
      color:#111827;
      line-height:1.4;
      flex:0 0 auto;
    }
    .roadmapWhat{
      font-size:11px;
      color:var(--text);
      font-weight:700;
      line-height:1.5;
      min-width:0;
    }
    .roadmapTag{
      display:inline-block;
      margin-top:6px;
      font-size:10px;
      font-weight:800;
      color:#2563eb;
      background:#eff6ff;
      border:1px solid #dbeafe;
      padding:2px 8px;
      border-radius:999px;
    }

    .wishStores{
      margin:0 0 10px;
      padding:8px 10px;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fff;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:baseline;
    }
    .wishLabel{
      font-size:12px;
      font-weight:800;
      color:var(--text);
      white-space:nowrap;
    }
    .wishNames{
      font-size:12px;
      font-weight:700;
      color:var(--text);
      line-height:1.45;
      min-width:0;
    }

    @media (min-width: 820px){
      .roadmapList{
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .scrollArea{
      height: calc(100vh - var(--topH));
      overflow:auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .scrollWrap{
      max-width:1100px;
      margin:0 auto;
      padding:10px 12px 22px;
    }

    .monthSection{
      background:transparent;
      margin-bottom:12px;
    }
    .monthHeader{
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      padding:9px 11px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px 14px 0 0;
      border-bottom:none;
    }
    .monthName{
      margin:0;
      font-size:14px;
      font-weight:900;
    }
    .monthMeta{
      font-size:11px;
      color:var(--muted);
      font-weight:700;
    }

    .dow{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      background:#f3f4f6;
      border:1px solid var(--border);
      border-top:none;
      border-bottom:none;
    }
    .dow div{
      padding:6px 6px;
      font-size:11px;
      font-weight:800;
      color:#374151;
      border-right:1px solid var(--border);
      text-align:center;
    }
    .dow div:nth-child(7){ border-right:none; }

    .grid{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      background:var(--bg);
      border:1px solid var(--border);
      border-top:none;
      border-radius:0 0 14px 14px;
      overflow:hidden;
      position:relative;
      width:100%;
      max-width:100%;
      box-sizing:border-box;
    }
    .cell{
      min-height:var(--cellh);
      border-right:1px solid var(--border);
      border-top:1px solid var(--border);
      padding:6px 6px 5px;
      position:relative;
      background:#fff;
      min-width:0;
      box-sizing:border-box;
    }
    .cell:nth-child(7n){ border-right:none; }

    .cell.outside{
      background:#f9fafb;
    }

    .date{
      font-size:11px;
      font-weight:700;
      display:flex;
      justify-content:space-between;
      align-items:center;
      min-height: 16px;
    }
    .date .num{ color:var(--text); }
    .date .out{ color:#9ca3af; }
    .today{
      display:inline-block;
      width:7px;height:7px;
      border-radius:999px;
      background:#2563eb;
      margin-left:5px;
      vertical-align:middle;
    }

    .lanes{
      margin-top:6px;
      display:flex;
      flex-direction:column;
      gap:var(--gap);
      min-width:0;
    }
    .bar{
      height:var(--barh);
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      padding:0 8px;
      font-size:11px;
      font-weight:700;
      color:#fff;
      white-space:nowrap;
      overflow:visible;         /* ★ テキストを見切れさせない */
      text-overflow:clip;       /* ★ 省略しない */
      min-width:0;
      position:relative;
      z-index:1;
    }

    /* ★ 連結バー：初日だけテキストを表示し、右側へはみ出しても見えるように前面に */
    .bar.segStart{
      margin-right:-6px;
      border-top-right-radius:0;
      border-bottom-right-radius:0;
      z-index:10;
    }
    .bar.segMid{
      margin-left:-6px;
      margin-right:-6px;
      border-radius:0;
      z-index:2;
    }
    .bar.segEnd{
      margin-left:-6px;
      border-top-left-radius:0;
      border-bottom-left-radius:0;
      z-index:2;
    }

    .bar.ghost{
      opacity:0;
    }

    .hint{
      margin-top:10px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
      font-size:12px;
      color:var(--muted);
      font-weight:650;
      line-height:1.45;
    }
    code{
      background:#f3f4f6;
      padding:1px 6px;
      border-radius:8px;
      font-weight:800;
      color:#111827;
    }
  </style>
</head>
<body>

  <div class="topFixed" id="topFixed">
    <header>
      <div class="title">
        <h1>【AI商品ナビ導入予定カレンダー】</h1>
      </div>
    </header>

    <div class="wrap">
      <section class="roadmap" aria-label="アップデートスケジュール概要">
        <div class="roadmapHead">
          <h2 class="roadmapTitle">アップデートスケジュール概要</h2>
        </div>
        <ul class="roadmapList" id="roadmapList"></ul>
      </section>

      <div class="wishStores" aria-label="導入待ち店舗">
        <div class="wishLabel">導入待ち店舗：</div>
        <div class="wishNames">歌舞伎町 / DPlaza大分 / 上野 / 池袋東口駅前 / 京都アバンティ / 栄三丁目 / 藤沢駅南口 / 秋葉原</div>
      </div>
    </div>
  </div>

  <div class="scrollArea" id="scrollArea">
    <div class="scrollWrap">
      <div id="months"></div>

      <div class="hint">
        予定は <code>EVENTS</code> を編集するだけ（読取専用運用向け）。<br>
        <code>end</code> は「最終日を含む」指定です（例：2/4〜2/6 は end="2026-02-06"）。
      </div>
    </div>
  </div>

<script>
const EVENTS = [
  { id: "e1", title: "栄本店(導入完了)", start: "2026-02-04", end: "2026-02-06", color: "#696969" },
  { id: "e2", title: "四条通(導入完了)", start: "2026-02-08", end: "2026-02-10", color: "#696969" },
  { id: "e3", title: "御徒町(導入完了)", start: "2026-02-12", end: "2026-02-12", color: "#696969" },
  { id: "e1", title: "なんば千日前店(導入完了)", start: "2026-02-16", end: "2026-02-18", color: "#696969" },
  { id: "e1", title: "梅田本店図面チェック(完了)", start: "2026-02-19", end: "2026-02-19", color: "#696969" },
  { id: "e2", title: "梅田本店(導入完了)", start: "2026-02-24", end: "2026-02-26", color: "#696969" },
  { id: "e2", title: "ツールアップデート(完了)", start: "2026-02-25", end: "2026-02-25", color: "#696969" },
  { id: "e3", title: "浅草(導入完了)", start: "2026-03-04", end: "2026-03-06", color: "#696969" },
  { id: "e3", title: "上野", start: "2026-03-11", end: "2026-03-13", color: "#2563eb" },
  { id: "e3", title: "福岡天神", start: "2026-03-17", end: "2026-03-20", color: "#2563eb" },
  { id: "e3", title: "千日前(1F改装MAPに変更)", start: "2026-03-16", end: "2026-03-16", color: "#2563eb" },
  { id: "e3", title: "松山大通(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-03-23", end: "2026-03-27", color: "#ee7800" },
  { id: "e3", title: "新川(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-03-09", end: "2026-03-13", color: "#7F1184" },
  { id: "e3", title: "新川(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-03-16", end: "2026-03-20", color: "#7F1184" },
  { id: "e3", title: "歌舞伎町(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-03-09", end: "2026-03-13", color: "#00B16B" },
  { id: "e3", title: "歌舞伎町(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-03-16", end: "2026-03-20", color: "#00B16B" },
  { id: "e3", title: "小樽(棚卸データ投入_エイジスレイアウト受領次第)", start: "2026-04-22", end: "2026-04-30", color: "#7F1184" },
  { id: "e2", title: "テキスト検索機能追加", start: "2026-05-18", end: "2026-05-22", color: "#00b16b" },
  { id: "e2", title: "AIテキスト検索機能追加", start: "2026-06-15", end: "2026-06-19", color: "#00b16b" },
];

/**
 * 月別ロードマップ（開発/アップデートの重要予定）
 */
const ROADMAP = [
  { when: "2026年2月25日", what: "ツールアップデート:棚座標変更機能追加", tag: "予定", sortKey: "2026-02" },
  { when: "2026年5月",  what: "テキスト検索機能追加", tag: "予定", sortKey: "2026-05" },
  { when: "2026年6月",  what: "AIテキスト検索機能追加(全商品検索対象にする)", tag: "予定", sortKey: "2026-06" },
];

function pad2(n){ return String(n).padStart(2,"0"); }
function toISODate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function parseISODate(s){
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function addDays(d, n){
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
}
function startOfMonth(d){
  return new Date(d.getFullYear(), d.getMonth(), 1);
}
function endOfMonth(d){
  return new Date(d.getFullYear(), d.getMonth()+1, 0);
}

function buildMonthMatrix(year, monthIndex){
  const first = new Date(year, monthIndex, 1);
  const last = new Date(year, monthIndex+1, 0);

  const start = addDays(first, -first.getDay());
  const end = addDays(last, 6 - last.getDay());

  const days = [];
  let cur = new Date(start);
  while(cur <= end){
    days.push(new Date(cur));
    cur = addDays(cur, 1);
  }
  return { start, end, days, first, last };
}

function splitEventIntoWeekSegments(ev){
  const s = parseISODate(ev.start);
  const e = parseISODate(ev.end);
  const segs = [];

  let cur = new Date(s.getFullYear(), s.getMonth(), s.getDate());

  while(cur <= e){
    const day = cur.getDay();
    const endOfWeek = addDays(cur, 6 - day);

    const segStart = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate());
    const segEnd = (endOfWeek < e) ? endOfWeek : e;

    segs.push({
      id: ev.id,
      title: ev.title,
      color: ev.color || "#111827",
      startISO: toISODate(segStart),
      endISO: toISODate(segEnd),
    });

    cur = addDays(segEnd, 1);
  }
  return segs;
}

function renderRoadmap(){
  const listEl = document.getElementById("roadmapList");
  if(!listEl) return;

  listEl.innerHTML = "";

  const sorted = [...ROADMAP].sort((a,b) => (a.sortKey || "").localeCompare(b.sortKey || ""));
  for(const item of sorted){
    const li = document.createElement("li");
    li.className = "roadmapItem";

    if(item.tag === "完了"){
      li.classList.add("done");
    }

    const when = document.createElement("div");
    when.className = "roadmapWhen";
    when.textContent = item.when;

    const what = document.createElement("div");
    what.className = "roadmapWhat";
    what.textContent = item.what;

    if(item.tag){
      const tag = document.createElement("div");
      tag.className = "roadmapTag";
      tag.textContent = item.tag;
      what.appendChild(document.createElement("br"));
      what.appendChild(tag);
    }

    li.appendChild(when);
    li.appendChild(what);
    listEl.appendChild(li);
  }
}

function renderMonth(year, monthIndex){
  const mountEl = document.getElementById("months");
  const matrix = buildMonthMatrix(year, monthIndex);
  const monthName = `${year}年${monthIndex+1}月`;
  const todayISO = toISODate(new Date());

  const section = document.createElement("section");
  section.className = "monthSection";

  const monthHeader = document.createElement("div");
  monthHeader.className = "monthHeader";

  const h = document.createElement("h2");
  h.className = "monthName";
  h.textContent = monthName;

  const meta = document.createElement("div");
  meta.className = "monthMeta";
  meta.textContent = `${pad2(monthIndex+1)}/${pad2(1)}〜${pad2(monthIndex+1)}/${pad2(endOfMonth(new Date(year, monthIndex, 1)).getDate())}`;

  monthHeader.appendChild(h);
  monthHeader.appendChild(meta);

  const dow = document.createElement("div");
  dow.className = "dow";
  ["日","月","火","水","木","金","土"].forEach(x=>{
    const d = document.createElement("div");
    d.textContent = x;
    dow.appendChild(d);
  });

  const gridEl = document.createElement("div");
  gridEl.className = "grid";

  const dayToCell = new Map();
  const cellToISO = [];

  for(const d of matrix.days){
    const cell = document.createElement("div");
    cell.className = "cell";

    const iso = toISODate(d);
    cellToISO.push(iso);
    dayToCell.set(iso, cell);

    if(d.getMonth() !== monthIndex){
      cell.classList.add("outside");
    }

    const date = document.createElement("div");
    date.className = "date";

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = (d.getMonth() === monthIndex) ? String(d.getDate()) : "";

    const out = document.createElement("span");
    out.className = "out";
    out.textContent = "";

    date.appendChild(num);
    date.appendChild(out);

    if(iso === todayISO && d.getMonth() === monthIndex){
      const dot = document.createElement("span");
      dot.className = "today";
      num.appendChild(dot);
    }

    const lanes = document.createElement("div");
    lanes.className = "lanes";

    cell.appendChild(date);
    cell.appendChild(lanes);

    gridEl.appendChild(cell);
  }

  const parts = [];
  for(const ev of EVENTS){
    const segs = splitEventIntoWeekSegments(ev);
    for(const s of segs){
      parts.push(s);
    }
  }

  const monthStartISO = toISODate(matrix.start);
  const monthEndISO = toISODate(matrix.end);

  const inRange = parts.filter(p => !(p.endISO < monthStartISO || p.startISO > monthEndISO));

  const lanesByDay = new Map();
  const placed = [];

  function isLaneFree(startISO, endISO, lane){
    let cur = parseISODate(startISO);
    const end = parseISODate(endISO);
    while(cur <= end){
      const iso = toISODate(cur);
      const s = lanesByDay.get(iso);
      if(s && s.has(lane)) return false;
      cur = addDays(cur, 1);
    }
    return true;
  }

  function occupyLane(startISO, endISO, lane){
    let cur = parseISODate(startISO);
    const end = parseISODate(endISO);
    while(cur <= end){
      const iso = toISODate(cur);
      if(!lanesByDay.has(iso)) lanesByDay.set(iso, new Set());
      lanesByDay.get(iso).add(lane);
      cur = addDays(cur, 1);
    }
  }

  inRange.sort((a,b)=>{
    if(a.startISO !== b.startISO) return a.startISO.localeCompare(b.startISO);
    const lenA = (parseISODate(a.endISO) - parseISODate(a.startISO));
    const lenB = (parseISODate(b.endISO) - parseISODate(b.startISO));
    return lenB - lenA;
  });

  for(const p of inRange){
    let lane = 0;
    while(!isLaneFree(p.startISO, p.endISO, lane)) lane++;
    occupyLane(p.startISO, p.endISO, lane);
    placed.push({...p, lane});
  }

  const maxLane = placed.reduce((m,x)=>Math.max(m, x.lane), -1);
  for(const iso of dayToCell.keys()){
    const cell = dayToCell.get(iso);
    const lanesEl = cell.querySelector(".lanes");
    for(let i=0;i<=maxLane;i++){
      const ghost = document.createElement("div");
      ghost.className = "bar ghost";
      ghost.textContent = "";
      lanesEl.appendChild(ghost);
    }
  }

  for(const p of placed){
    const s = parseISODate(p.startISO);
    const e = parseISODate(p.endISO);

    const clipS = (p.startISO < monthStartISO) ? parseISODate(monthStartISO) : s;
    const clipE = (p.endISO > monthEndISO) ? parseISODate(monthEndISO) : e;

    for(let i=0;i<cellToISO.length;i++){
      const iso = cellToISO[i];
      if(iso === toISODate(clipS)){
        p.startIdx = i;
      }
      if(iso === toISODate(clipE)){
        p.endIdx = i;
      }
    }

    for(let i=p.startIdx;i<=p.endIdx;i++){
      const iso = cellToISO[i];
      const cell = dayToCell.get(iso);
      if(!cell) continue;
      const lanesEl = cell.querySelector(".lanes");

      const slot = lanesEl.children[p.lane];
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.background = p.color;

      if(i === p.startIdx && i === p.endIdx){
        bar.style.borderRadius = "10px";
      }else if(i === p.startIdx){
        bar.style.borderRadius = "10px 0 0 10px";
      }else if(i === p.endIdx){
        bar.style.borderRadius = "0 10px 10px 0";
      }else{
        bar.style.borderRadius = "0";
      }

      // ★ テキストは「連結バーの初日」だけに表示（ただし overflow:visible で右へ伸ばす）
      bar.textContent = (i === p.startIdx) ? p.title : "";

      if(i === p.startIdx && i !== p.endIdx){
        bar.classList.add("segStart");
      }else if(i === p.endIdx && i !== p.startIdx){
        bar.classList.add("segEnd");
      }else if(i !== p.startIdx && i !== p.endIdx){
        bar.classList.add("segMid");
      }
      lanesEl.replaceChild(bar, slot);
    }
  }

  section.appendChild(monthHeader);
  section.appendChild(dow);
  section.appendChild(gridEl);
  mountEl.appendChild(section);
}

function renderAllMonths(){
  const monthsEl = document.getElementById("months");
  monthsEl.innerHTML = "";

  const starts = EVENTS.map(e=>parseISODate(e.start));
  const ends = EVENTS.map(e=>parseISODate(e.end));
  const minDate = new Date(Math.min(...starts));
  const maxDate = new Date(Math.max(...ends));

  const startM = startOfMonth(minDate);
  const endM = startOfMonth(maxDate);

  let cur = new Date(startM.getFullYear(), startM.getMonth(), 1);
  while(cur <= endM){
    renderMonth(cur.getFullYear(), cur.getMonth());
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
}

function syncTopHeight(){
  const top = document.getElementById("topFixed");
  if(!top) return;
  const h = top.getBoundingClientRect().height;
  document.documentElement.style.setProperty("--topH", `${Math.ceil(h)}px`);
}

window.addEventListener("resize", syncTopHeight);

renderRoadmap();
renderAllMonths();
syncTopHeight();
</script>
</body>
