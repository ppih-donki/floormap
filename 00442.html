<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIBUYAHONTEN_FLOORMAP</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      font-family: sans-serif;
    }
    .container {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }
    .container img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 10px;
    }
    .link-text {
      display: inline-block;
      font-weight: bold;
      font-size: 1.5em;
      padding: 10px 20px;
      background-color: #F39C12;
      color: white;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      margin: 20px 0;
    }
    .link-text:hover {
      background-color: #e08e0b;
      color: #000;
    }
    .event-link {
      font-weight: bold;
      font-size: 0.9em; /* 約60%に縮小 */
      color: #007BFF;
      text-decoration: none;
      margin-bottom: 30px;
    }
    .event-link:hover {
      text-decoration: underline;
      color: #0056b3;
    }
    @media (max-width: 480px) {
      .link-text {
        font-size: 1em;
        padding: 6px 10px;
      }
      .event-link {
        font-size: 0.8em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="https://ai-item-location-search-web-1066573637137.us-central1.run.app/?store_code=00442" target="_blank" class="link-text">
      【Go to "AI NAVI"】
    </a>
    <img src="images/00442_info_delivery.jpg" alt="デリバリー">
    <img src="images/00442_a_map.jpg" alt="フロアマップa">
    <img src="images/00442_info_petgoods.jpg" alt="ペット用品">
    <img src="images/00442_b_map.jpg" alt="フロアマップb">
    <img src="images/00442_list_map.jpg" alt="全フロアリスト">
  </div>
</body>
</html>
