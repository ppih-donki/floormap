<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>メンテナンス中｜AI商品ナビ 商品管理ツール</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
      background: #f6f7f9;
      color: #111;
    }
    .wrap {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 20px;
      line-height: 1.4;
    }
    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
      color: #333;
    }
    .time {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #e5e7eb;
      color: #111;
      font-weight: 600;
    }
    .note {
      margin-top: 8px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-label="メンテナンス案内">
      <h1>AI商品ナビの商品管理ツールはメンテナンス中です</h1>
      <p>機能アップデートに伴い、本日 <strong>2月25日</strong> はメンテナンスを実施しています。</p>
      <p class="time">メンテナンス時間：13:30〜15:30</p>
      <p class="note">ご不便をおかけしますが、時間をおいて再度アクセスしてください。</p>
    </section>
  </main>
</body>
</html>
