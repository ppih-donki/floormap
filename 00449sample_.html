<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMEDA HONTEN_FLOORMAP</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #f7f7f7;
      overflow-x: hidden; /* 横方向のはみ出しが原因のズレを潰す */
    }

    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0; /* 端末側の差を避ける */
    }

    .container img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 20px; /* 念のため中央寄せを強制 */
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="./images/00449_separate_map_3F.jpg" alt="3F Map">
    <img src="./images/00449_separate_map_4F.jpg" alt="4F Map">
    <img src="./images/00449_separate_map_5F.jpg" alt="5F Map">
    <img src="./images/00449_separate_map_6F.jpg" alt="6F Map">
  </div>
</body>
</html>
